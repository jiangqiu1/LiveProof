openapi: 3.0.3
info:
  title: LiveProof 视频演示证据核验 API
  version: 1.0.0
  description: |
    从回放里定位每一条产品承诺，检查它有没有被实际操作证明，并把尚未验证的问题转成待办。

    ## 四类核验字段（相互独立，不得互相推导）
    - '`reviewStatus`：这条人工看过没有（unreviewed / in_review / reviewed）'
    - '`answerStatus`：视频里有没有这样说（answered / partially_answered / not_found）'
    - '`evidenceType`：证据是什么形态（verbal_claim / specification_display / operational_evidence / unknown）'
    - '`evidenceSufficiency`：证据够不够（not_checked / insufficient / sufficient）'

    任取值的组合都**不等于「内容为真」**。`PATCH` 只更新请求中出现的字段。

    ## 错误结构
    所有错误统一为 `{"error":{"code":"...","message":"..."}}`；校验类错误额外带 `details`。

servers:
  - url: http://127.0.0.1:8080
    description: 本地后端（旧 Node 参考实现保留在 8787，不对外）

tags:
  - name: cases
    description: 核验用例与改判
  - name: todos
    description: 待办（独立持久化实体）
  - name: materials
    description: 素材库（保利威点播为主存储；内置示例走 /media）
  - name: media
    description: 演示视频与字幕
  - name: smart-subtitles
    description: 保利威智能字幕（云端 ASR；与本地 SRT 链路完全独立）
  - name: ai
    description: AI 辅助核验（只产出建议，不写库）
  - name: reports
    description: 复盘报告（即时生成，不落库）

paths:
  /api/materials/capabilities:
    get:
      tags: [materials]
      summary: 素材库能力状态（只读）
      description: |
        前端据此禁用上传按钮，而不是让用户点了才失败。**不会触发任何上传或保利威调用**。

        `uploadEnabled=false` 时 `POST /api/materials` 固定返回 503 `POLYV_UPLOAD_NOT_CONFIGURED`。
      operationId: getMaterialCapabilities
      responses:
        '200':
          description: 能力状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCapabilities'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/materials:
    get:
      tags: [materials]
      summary: 素材列表
      description: |
        内置示例（`storage=local`，`builtin=true`）与用户上传（`storage=polyv`）混排，
        按创建时间倒序。响应只含素材 id 与展示用文件名，**不含任何文件系统路径**。
      operationId: listMaterials
      responses:
        '200':
          description: 素材列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [materials]
      summary: 上传素材到保利威点播
      description: |
        **同步转发保利威 + 异步转码**：接口在文件转发完成后立即返回 202 + `status=transcoding`，
        前端轮询 `GET /api/materials/{id}` 直到 `status=ready`（实测 3.4MB / 106s 视频约 25 秒）。

        安全约束：
        - 不接收客户端指定的 `vid` / 存储路径，保利威返回的 vid 由服务端保存
        - 扩展名、魔数、大小三重校验；非法直接 422，不落库
        - 校验失败的临时文件会清理，不留残片
      operationId: uploadMaterial
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 视频文件（mp4）；大小上限见 `capabilities.maxBytes`
      responses:
        '202':
          description: 已接收并转发完成，转码进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '422':
          description: |
            文件不合规（`MATERIAL_INVALID_FILE`）或素材数量已达上限（`MATERIAL_LIMIT_EXCEEDED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 转发保利威失败（`POLYV_UPLOAD_FAILED`），message 不含 writeToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 未配置 `POLYV_VOD_WRITE_TOKEN`（`POLYV_UPLOAD_NOT_CONFIGURED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: 上传超时（`POLYV_UPLOAD_TIMEOUT`），文件未完成上传，可重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/materials/{id}:
    get:
      tags: [materials]
      summary: 素材详情（轮询转码状态）
      operationId: getMaterial
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      responses:
        '200':
          description: 素材详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '404':
          description: 素材不存在（`MATERIAL_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [materials]
      summary: 删除素材
      description: |
        默认拒绝删除仍有核验事项引用的素材（409 `MATERIAL_IN_USE`）。
        内置示例素材不可删除（409 `BUILTIN_MATERIAL`）。
      operationId: deleteMaterial
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      responses:
        '204':
          description: 已删除
        '404':
          description: 素材不存在（`MATERIAL_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 仍被引用（`MATERIAL_IN_USE`）或内置素材（`BUILTIN_MATERIAL`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/materials/{id}/play:
    get:
      tags: [materials]
      summary: 获取播放地址
      description: |
        返回保利威点播直链（或内置素材的 `/media/{name}` 地址），供工作台 `<video>` 使用。

        **实测两处易误判（2026-10-23）**：
        - `polyvStatus=50`（等待审核）时 `transcodeInfos[].status` 为 `"unavailable"`，
          但 `playUrl` **已经可以 200/206 播放** —— 因此本接口照常返回地址，
          只用 `published=false` 说明「尚未正式发布」，不阻塞播放
        - 只返回 `format=mp4` 且 `encrypt=false` 的直链；加密地址浏览器放不了

        素材未就绪（`transcoding` / `failed`）返回 409 `MATERIAL_NOT_READY`，
        与「没有播放地址」是两件事，前端文案需区分。
      operationId: getMaterialPlay
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      responses:
        '200':
          description: 播放信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialPlay'
        '404':
          description: 素材不存在（`MATERIAL_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 素材尚未就绪（`MATERIAL_NOT_READY`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 保利威截图/查询失败（`POLYV_SNAPSHOT_FAILED` 等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/materials/{id}/subtitle:
    post:
      tags: [materials]
      summary: 为素材上传本地 SRT 字幕
      description: |
        与 `POST /api/smart-subtitles/tasks` 完全独立：本接口只处理人工整理的本地 SRT，
        **不调用任何语音识别服务**。上传成功后 `srtFileName` 有值。
      operationId: uploadMaterialSubtitle
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: SRT 字幕文件
      responses:
        '200':
          description: 更新后的素材详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '404':
          description: 素材不存在（`MATERIAL_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: SRT 格式不合法（`MATERIAL_INVALID_FILE`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [materials]
      summary: 移除素材的本地 SRT
      description: |
        删除字幕文件并把 `materials.srt_file_name` 真的清成 NULL。

        必须用显式 `set(..., null)` 的更新：MyBatis-Plus 的 `updateById` 默认跳过 null 字段，
        只改内存实体会出现「文件已删、登记还在」，随后字幕解析拿着一个不存在的文件名报错。
      operationId: deleteMaterialSubtitle
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      responses:
        '200':
          description: 更新后的素材详情（`srtFileName` 为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '404':
          description: 素材不存在（`MATERIAL_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/datasets:
    get:
      tags: [cases]
      summary: 数据集列表及用例数
      operationId: listDatasets
      responses:
        '200':
          description: 数据集列表，cf 优先
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/cases:
    get:
      tags: [cases]
      summary: 用例列表
      operationId: listCases
      parameters:
        - name: ds
          in: query
          schema:
            type: string
            enum: [cf, lc]
          description: 数据集标识
        - name: materialId
          in: query
          schema:
            type: string
            maxLength: 40
          description: 按素材收敛；缺省表示该数据集下全部素材
          example: mat_b2197f3bb5654e65
        - name: reviewStatus
          in: query
          schema:
            $ref: '#/components/schemas/ReviewStatus'
        - name: answerStatus
          in: query
          schema:
            $ref: '#/components/schemas/AnswerStatus'
        - name: evidenceType
          in: query
          schema:
            $ref: '#/components/schemas/EvidenceType'
        - name: evidenceSufficiency
          in: query
          schema:
            $ref: '#/components/schemas/EvidenceSufficiency'
      responses:
        '200':
          description: 按 startSec 升序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [cases]
      summary: 手动新增核验事项
      description: |
        归属由 `materialId` 决定，客户端**不能**自带 `video`（服务端按素材类型选择：
        内置素材用文件名走 `/media`，云端素材用素材 id）。

        **新行的四个核验字段由服务端固定，不接受客户端指定**：
        - `reviewStatus = unreviewed`
        - `answerStatus = not_found` —— 这只是**数据库占位值**，
          产品语义是「尚未核验」，**不得**展示为「视频没有这样说」
        - `evidenceType = unknown`
        - `evidenceSufficiency = not_checked`
        - `source = manual`，`id` / `createdAt` 亦由服务端生成

        素材未就绪（转码中或失败）返回 409 `MATERIAL_NOT_READY`。
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreateRequest'
            examples:
              minimal:
                summary: 只填必填项
                value:
                  materialId: mat_b2197f3bb5654e65
                  question: 候选人列表是否支持自定义字段
                  claim: 支持为候选人列表添加自定义字段
              withWindow:
                summary: 带演示区间与人工时间点
                value:
                  materialId: mat_b2197f3bb5654e65
                  question: 候选人导出是否支持批量操作
                  claim: 支持一键导出全部候选人为 CSV
                  startSec: 12.5
                  endSec: 20.0
                  timePoints: [13.2, 18.75]
                  reasoning: 12s 处点击导出按钮
                  limitations: 未覆盖 5000 条规模
      responses:
        '201':
          description: 创建成功。四字段为服务端固定占位值，不代表已核验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '400':
          description: |
            参数不合法（`INVALID_PARAMETER`），例如缺少 `materialId`、
            `startSec`/`endSec` 只填一个、`startSec > endSec`、文本超长
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 素材尚未就绪（`MATERIAL_NOT_READY`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/cases/import/template:
    get:
      tags: [cases]
      summary: 下载 CSV 导入模板
      description: |
        返回 UTF-8（带 BOM，Excel 直接打开不乱码）的 CSV，表头为
        `问题,承诺,开始秒,结束秒`，附一行格式示例。

        **这是用户自己整理的核验问题清单模板，不是 AI 自动生成的承诺。**
      operationId: downloadCaseImportTemplate
      responses:
        '200':
          description: CSV 附件
          content:
            text/csv:
              schema:
                type: string
              example: |
                问题,承诺,开始秒,结束秒
                候选人列表是否支持自定义字段,支持为候选人列表添加自定义字段,45,58

  /api/cases/import/preview:
    post:
      tags: [cases]
      summary: 导入预览（解析 + 逐行校验 + 重复检测，不写库）
      description: |
        **不写库**。前端必须先把逐行结果展示给用户确认，再由用户点击「确认导入」
        调用 `POST /api/cases/import`。

        `duplicateCount` 统计与库内已有事项重复的行（`归一化 question + 素材` 相同）。
        表头中保留列名（如 `id`、`reviewStatus`）会被拒绝（422 `CASE_IMPORT_RESERVED_COLUMN`），
        避免用户以为 CSV 能指定核验字段。
      operationId: previewCaseImport
      parameters:
        - $ref: '#/components/parameters/MaterialIdOptional'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV 文件（UTF-8，可选 BOM）
      responses:
        '200':
          description: 逐行解析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseImportPreview'
        '404':
          description: 素材不存在（`MATERIAL_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 素材尚未就绪（`MATERIAL_NOT_READY`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            CSV 不可解析（`MATERIAL_INVALID_FILE`）或表头含保留列（`CASE_IMPORT_RESERVED_COLUMN`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/cases/import:
    post:
      tags: [cases]
      summary: 执行导入
      description: |
        两档策略，**都不静默忽略问题行**：
        - `strict`（默认）：存在任何非法行则**整批拒绝**，一条都不写，
          返回 422 `CASE_IMPORT_HAS_INVALID_ROWS`，`skipped` 列出全部问题行
        - `skip_invalid`：跳过非法行、写入合法行，并在 `skipped` 里如实列出跳过的行号与原因

        导入的行与手动新增一致：`source=csv`，四个核验字段仍为服务端固定占位值。
      operationId: importCases
      parameters:
        - $ref: '#/components/parameters/MaterialIdOptional'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV 文件（UTF-8，可选 BOM）
                policy:
                  type: string
                  enum: [strict, skip_invalid]
                  default: strict
                  description: 有非法行时的处理策略
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseImportResult'
        '404':
          description: 素材不存在（`MATERIAL_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 素材尚未就绪（`MATERIAL_NOT_READY`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `strict` 下存在非法行（`CASE_IMPORT_HAS_INVALID_ROWS`，整批未写入）、
            表头含保留列（`CASE_IMPORT_RESERVED_COLUMN`）或文件不可解析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/cases/{id}:
    get:
      tags: [cases]
      summary: 用例详情
      operationId: getCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: 用例详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [cases]
      summary: 人工改判（四字段独立更新）
      description: |
        请求体中出现的字段才会被写入，未出现的字段保持原值。
        显式传 `null` 等同于未提供。
        至少需要一个可更新字段，否则返回 400 `NO_UPDATABLE_FIELD`。
        先查存在性再更新，重复提交相同值仍返回 200。
      operationId: patchCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasePatchRequest'
            examples:
              onlyAnswer:
                summary: 只改回答状态
                value:
                  answerStatus: partially_answered
              allFour:
                summary: 四字段一起改
                value:
                  reviewStatus: reviewed
                  answerStatus: answered
                  evidenceType: operational_evidence
                  evidenceSufficiency: sufficient
      responses:
        '200':
          description: 更新后的完整用例详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [cases]
      summary: 删除核验事项
      description: |
        默认**拒绝**删除仍有挂接待办的事项（409），避免待办变成孤儿。
        确认要连带删除时显式传 `withTodos=true`。
      operationId: deleteCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: withTodos
          in: query
          schema:
            type: boolean
            default: false
          description: true 表示连带删除该事项下的待办
      responses:
        '204':
          description: 已删除
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 仍有挂接待办且未传 `withTodos=true`（`CASE_HAS_TODOS`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos:
    get:
      tags: [todos]
      summary: 待办列表
      operationId: listTodos
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TodoStatus'
        - name: caseId
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 按创建时间倒序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
